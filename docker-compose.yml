services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-tree-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mongo}
      APP_TREE_STRATEGY: ${APP_TREE_STRATEGY:-custom}
      MONGODB_URI: mongodb://mongodb:27017/restaurant_tree_system
      POSTGRES_URL: jdbc:postgresql://postgres:5432/restaurant_tree_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      - mongodb
      - postgres

  mongodb:
    image: mongo:7
    container_name: restaurant-tree-mongodb
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db

  postgres:
    image: postgres:17
    container_name: restaurant-tree-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: restaurant_tree_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mongodb_data:
  postgres_data:
